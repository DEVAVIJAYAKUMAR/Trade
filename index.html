    --fg:#EDEFFA; --muted:#9AA1C0; --accent:#8392FF; --accent-fg:#0E1020;

*{box-sizing:border-box}

  padding-block:0;

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function makeHist(key,base,n,drift,vol){const r=rng(hash(key));const a=[100];for(let i=1;i<n;i++)a.push(a[i-1]*Math.exp(drift+vol*gauss(r)));const k=base/a[n-1];return a.map(x=>x*k)}
function extend(x,m,days=21){const r=rng(hash(x.key+'m'+m));let last=x.hist[x.hist.length-1];for(let i=0;i<days;i++){last*=Math.exp(x.drift+x.vol*gauss(r));x.hist.push(last)}}
function sample(a,max=140){if(a.length<=max)return a;const o=[];for(let i=0;i<max;i++)o.push(a[Math.round(i*(a.length-1)/(max-1))]);return o}

/* ---------- Indian market session gate (IST) ----------
   App-specific simulation schedule:
   pre-market 09:00-09:10; wait 09:10-09:15;
   index/underlying movement 09:15-15:15;
   option-premium window 09:15-15:40.
   These are practice-app rules, not a claim of exchange live data. */
const MARKET_HOLIDAYS={
  '2026-01-15':'Maharashtra municipal corporation election',
  '2026-01-26':'Republic Day',
  '2026-03-03':'Holi',
  '2026-03-26':'Shri Ram Navami',
  '2026-03-31':'Shri Mahavir Jayanti',
  '2026-04-03':'Good Friday',
  '2026-04-14':'Dr. B. R. Ambedkar Jayanti',
  '2026-05-01':'Maharashtra Day',
  '2026-05-28':'Bakri Id',
  '2026-06-26':'Muharram',
  '2026-09-14':'Ganesh Chaturthi',
  '2026-10-02':'Mahatma Gandhi Jayanti',
  '2026-10-20':'Dussehra',
  '2026-11-10':'Diwali-Balipratipada',
  '2026-11-24':'Prakash Gurpurb Sri Guru Nanak Dev',
  '2026-12-25':'Christmas'
};
function istParts(date=new Date()){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);
  const o={};for(const p of parts)if(p.type!=='literal')o[p.type]=p.value;
  return {dateKey:o.year+'-'+o.month+'-'+o.day,minute:+o.hour*60 + +o.minute,hh:o.hour,mm:o.minute,ss:o.second};
}
function marketSession(date=new Date()){
  const p=istParts(date),day=new Date(p.dateKey+'T12:00:00+05:30').getUTCDay();
  const holiday=MARKET_HOLIDAYS[p.dateKey];
  let status='CLOSED',label='MARKET CLOSED',indexOpen=false,optionsOpen=false;
  if(holiday){label='HOLIDAY · '+holiday}
  else if(day===0||day===6){label='WEEKEND · MARKET CLOSED'}
  else if(p.minute>=540&&p.minute<550){status='PRE';label='PRE-MARKET'}
  else if(p.minute>=550&&p.minute<555){status='OPENING';label='PRE-OPEN · WAITING'}
  else if(p.minute>=555&&p.minute<915){status='INDEX';label='MARKET SESSION';indexOpen=true;optionsOpen=true}
  else if(p.minute>=915&&p.minute<940){status='OPTIONS';label='INDEX CLOSED · OPTIONS ACTIVE';optionsOpen=true}
  else if(p.minute<540){label='BEFORE MARKET'}
  else{label='MARKET CLOSED'}
  return {...p,status,label,indexOpen,optionsOpen,holiday:holiday||null};
}
function updateMarketClock(){
  const el=$('#clock');if(!el)return;
  const m=marketSession(),time=m.hh+':'+m.mm;
  el.textContent=time+' IST · '+m.label;

}

function buildMarket(months){

}

const r3=f=>{const n=f.hist.length,i=Math.max(0,n-1-756);return(Math.pow(nav(f)/f.hist[i],252/(n-1-i))-1)*100};

if(!sess||!accts()[sess]||!ls.g(TK)){

function labBS(S,K,r,v,T,call){const d1=(Math.log(S/K)+(r+v*v/2)*T)/(v*Math.sqrt(T)),d2=d1-v*Math.sqrt(T),N=x=>{const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=1-d*((((1.330274*t-1.821256)*t+1.781478)*t-.356538)*t);return x>=0?p:1-p},pdf=Math.exp(-d1*d1/2)/Math.sqrt(2*Math.PI);return{p:Math.max(.05,call?S*N(d1)-K*Math.exp(-r*T)*N(d2):K*Math.exp(-r*T)*N(-d2)-S*N(-d1)),d:call?N(d1):N(d1)-1,th:(-(S*pdf*v)/(2*Math.sqrt(T))-r*K*Math.exp(-r*T)*(call?N(d2):N(-d2)))/365,iv:v}}

function spark(v){const w=56,h=24,n=v.length;let mn=Math.min(...v),mx=Math.max(...v);if(mx===mn)mx+=1;

  return`<svg class="spark ${cl(v[n-1]-v[0])}" viewBox="0 0 ${w} ${h}" style="color:var(--${v[n-1]>=v[0]?'up':'down'})" aria-hidden="true"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

function chartSVG(v){
  // Same full-width, fixed line-chart presentation for Mutual Funds and Stocks.
  const W=360,H=220,p=8,n=v.length;let mn=Math.min(...v),mx=Math.max(...v);if(mx===mn){mx+=1;mn-=1}
  const X=i=>p+(W-2*p)*i/Math.max(1,n-1),Y=x=>p+(H-2*p)*(1-(x-mn)/(mx-mn));
  const pts=v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)).join(' ');
  return`<svg id="ch" class="chart ${v[n-1]>=v[0]?'up':'down'}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:220px;max-width:100%" role="img" aria-label="Static price chart"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><polygon points="${p},${H-p} ${pts} ${W-p},${H-p}" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

const FO=[['NIFTY','NIFTY 50',65,50,.14,0],['SENSEX','SENSEX',20,100,.15,1],['BANKNIFTY','BANK NIFTY',30,100,.17,2],['FINNIFTY','FINNIFTY',40,50,.18,3],['RELIANCE','Reliance',500,10,.25],['TCS','TCS',175,20,.22],['HDFCBANK','HDFC Bank',550,10,.22],['INFY','Infosys',400,20,.24],['SBIN','SBI',750,10,.27]].map(([s,n,lot,step,iv,ix])=>({s,n,lot,step,iv,ix}));
const FOM={};FO.forEach(u=>FOM[u.s]=u);
let fou='NIFTY',foe=0,fseg='chain';
const isIdx=u=>u.ix!==undefined;
const spot=u=>isIdx(u)?idxVal(IDX[u.ix],'px'):SM[u.s].px;
const prevS=u=>isIdx(u)?idxVal(IDX[u.ix],'prev'):SM[u.s].prev;
function exps(u,mon){const o=[],d=new Date(simNow());d.setHours(15,30,0,0);
  if(isIdx(u)&&!mon){d.setDate(d.getDate()+((4-d.getDay()+7)%7||7));for(let i=0;i<3;i++){o.push(d.getTime());d.setDate(d.getDate()+7)}}
  else{for(let m=0;o.length<3;m++){const e=new Date(d.getFullYear(),d.getMonth()+m+1,0,15,30);while(e.getDay()!==4)e.setDate(e.getDate()-1);if(e.getTime()>simNow())o.push(e.getTime())}}
  return o}
const N=x=>{const t=1/(1+.2316419*Math.abs(x)),p=.3989423*Math.exp(-x*x/2)*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p};
function ltp(i,S0,t0){const u=FOM[i.u],S=S0??spot(u),T=Math.max(0,(i.e-(t0??simNow()))/(365*864e5));
  if(i.t==='FUT')return Math.round(S*Math.exp(.07*T)*20)/20;
  const c=i.t==='CE',K=i.k;let x;
  if(T<=0)x=Math.max(0,c?S-K:K-S);
  else{const v=u.iv,d1=(Math.log(S/K)+(.07+v*v/2)*T)/(v*Math.sqrt(T)),d2=d1-v*Math.sqrt(T),D=K*Math.exp(-.07*T);x=c?S*N(d1)-D*N(d2):D*N(-d2)-S*N(-d1)}
  return T<=0&&x===0?0:Math.max(.05,Math.round(x*20)/20)}
const foDate=e=>dstr(e,{day:'numeric',month:'short'});
const foName=i=>FOM[i.u].n+' '+(i.t==='FUT'?'FUT':i.k+' '+i.t)+' '+foDate(i.e);
const foKey=i=>[i.u,i.t,i.k,i.e].join('|');
function marginUsed(){let m=0;for(const k in st.fo){const p=st.fo[k],S=spot(FOM[p.u]);if(p.t==='FUT')m+=.12*S*Math.abs(p.q);else if(p.q<0)m+=.15*S*-p.q}return m}
function foPnl(){let u=0;for(const k in st.fo){const p=st.fo[k];u+=(ltp(p)-p.avg)*p.q}return u}
function foTrade(i,dq,px){let realized=0;const k=foKey(i),p=st.fo[k]||(st.fo[k]={u:i.u,t:i.t,k:i.k,e:i.e,q:0,avg:0});
  if(i.t!=='FUT')st.cash-=dq*px;
  if(!p.q||Math.sign(p.q)===Math.sign(dq)){p.avg=(p.avg*Math.abs(p.q)+px*Math.abs(dq))/(Math.abs(p.q)+Math.abs(dq));p.q+=dq}
  else{const c=Math.min(Math.abs(dq),Math.abs(p.q)),pl=(px-p.avg)*c*Math.sign(p.q);realized=pl;if(i.t==='FUT')st.cash+=pl;st.fr+=pl;p.q+=dq;if(p.q&&Math.sign(p.q)===Math.sign(dq))p.avg=px}
  if(!p.q)delete st.fo[k];
  log(dq>0?'BUY':'SELL',foName(i),Math.abs(dq),px,Math.abs(dq*px));st.orders[0].fo=1;st.orders[0].pnl=realized;st.orders[0].foInfo={u:i.u,t:i.t,k:i.k,e:i.e}}
function checkTpSl(){let hit=0;for(const p of Object.values(st.fo)){if(!p.tp&&!p.sl)continue;const l=ltp(p),L=p.q>0;let w=null;
  if(p.tp&&(L?l>=p.tp:l<=p.tp))w='TP';else if(p.sl&&(L?l<=p.sl:l>=p.sl))w='SL';
  if(w){const nm=foName(p),pl=(l-p.avg)*p.q;foTrade(p,-p.q,l);hit=1;toast(`${w} hit · ${nm} · ${sinr(pl,0)}`)}}if(hit)save()}

let ctype='line',rr=null,drag=null;
function idxSeries(ix,r){const g=S.filter(ix.f),per=s=>r==='1D'?s.intra.slice(-120):s.hist.slice(-({'1W':6,'1M':21,'3M':63,'1Y':250}[r])).concat([s.px]);
  const L=Math.min(...g.map(s=>per(s).length));return Array.from({length:L},(_,i)=>ix.k*g.reduce((a,s)=>{const q=per(s);return a+q[q.length-L+i]/s.base0},0)/g.length)}
function mainS(){let v;
  if(detail.t==='stock')v=stockSeries(SM[detail.id],range);

    v=U.map((s,j)=>ltp(i,s,range==='1D'?now:now-(L-1-j)*864e5))}

function candles(v){const n=v.length,g=Math.max(1,Math.ceil(n/40)),o=[];let pc=v[0];
  for(let a=0,k=0;a<n;a+=g,k++){const s=v.slice(a,a+g),c=s[s.length-1],op=k?pc:s[0];let h=Math.max(op,...s),l=Math.min(op,...s);
    if(g===1){const w=Math.abs(c-op)*(.2+(hash(''+k+n)%60)/100);h+=w;l=Math.max(0,l-w)}o.push({o:op,h,l,c});pc=c}return o}
const toolbar=()=>`<div class="chips">${chip('ctype','candle','Candle',ctype==='candle')}${chip('ctype','line','Line',ctype==='line')}${chip('rrtool','long','+ Long R:R',!!rr&&rr.side==='long')}${chip('rrtool','short','+ Short R:R',!!rr&&rr.side==='short')}${rr?chip('rrtool','clear','Clear',false):''}</div>`;

  return`<rect x="${x0}" y="${Math.min(e,t)}" width="${W-x0}" height="${Math.abs(e-t)}" style="fill:var(--up);fill-opacity:.2"/><rect x="${x0}" y="${Math.min(e,s)}" width="${W-x0}" height="${Math.abs(e-s)}" style="fill:var(--down);fill-opacity:.2"/>
  ${ln(e,'var(--muted)',1)}${ln(t,'var(--up)')}${ln(s,'var(--down)')}${tx(t,'var(--up)',rr.tp>rr.entry,'TP '+fmt(rr.tp))}${tx(s,'var(--down)',rr.sl>rr.entry,'SL '+fmt(rr.sl))}${tx(e,'var(--muted)',rr.side==='short','Entry '+fmt(rr.entry))}
  <circle cx="${W-14}" cy="${t}" r="6" style="fill:var(--up)"/><circle cx="${W-14}" cy="${s}" r="6" style="fill:var(--down)"/>`}
function rrInfo(){if(!rr)return'Pick + Long R:R or + Short R:R, then drag the TP and SL handles on the right.';
  const q=detail.t==='prem'?FOM[detail.i.u].lot:1,k=detail.t==='prem'?'per lot':'per unit',rk=Math.abs(rr.entry-rr.sl),rw=Math.abs(rr.tp-rr.entry);

function drawX(){
  const box=$('#chartBox');if(!box)return;const v=mainS(),W=360,H=220,p=8,n=v.length;
  let mn=Math.min(...v),mx=Math.max(...v);if(rr){mn=Math.min(mn,rr.tp,rr.sl,rr.entry);mx=Math.max(mx,rr.tp,rr.sl,rr.entry)}
  const pp=detail.t==='prem'&&st.fo[foKey(detail.i)];if(pp)[pp.avg,pp.tp,pp.sl].forEach(x=>{if(x){mn=Math.min(mn,x);mx=Math.max(mx,x)}});
  if(mx===mn){mx+=1;mn-=1}const pad=(mx-mn)*.08;mn-=pad;mx+=pad;
  const X=i=>p+(W-2*p)*i/Math.max(1,n-1),Y=x=>p+(H-2*p)*(1-(x-mn)/(mx-mn));
  cur={v,mn,mx,H,W,p,Y,X};
  const pts=v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)).join(' ');
  const levels=rr?[['Entry','var(--muted)',rr.entry],['TP','var(--up)',rr.tp],['SL','var(--down)',rr.sl]]:[];
  const ppLevels=pp?[['Buy','var(--accent)',pp.avg],['TP','var(--up)',pp.tp],['SL','var(--down)',pp.sl]].filter(a=>a[2]):[];
  const lines=[...levels,...ppLevels].map(([l,c,x])=>`<line x1="0" x2="${W}" y1="${Y(x)}" y2="${Y(x)}" style="stroke:${c}" stroke-width="1.2" ${l==='Entry'||l==='Buy'?'stroke-dasharray="4 3"':''}/><text x="4" y="${Y(x)-3}" font-size="9" style="fill:${c}">${l} ${fmt(x)}</text>`).join('');
  box.innerHTML=`<svg id="ch" class="chart ${v[n-1]>=v[0]?'up':'down'}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:220px;max-width:100%;touch-action:${rr?'none':'pan-y'}" role="img" aria-label="Static full-width price line chart"><defs><linearGradient id="gx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><polygon points="${p},${H-p} ${pts} ${W-p},${H-p}" fill="url(#gx)"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${lines}<g id="rrg">${rrSVG()}</g></svg>`;
  const label={'1D':'Today, simulated intraday','1W':'Last week','1M':'Last month','3M':'Last 3 months','1Y':'Last year'}[range];
  const hv=$('#dHover'),svg=$('#ch');hv.textContent=label;$('#rrOut').innerHTML=rrInfo();
  const pt=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  svg.addEventListener('pointerdown',e=>{if(!rr)return;const[x,y]=pt(e);for(const k of['tp','sl'])if(x>W*.45&&Math.abs(y-Y(rr[k]))<16){drag=k;hovering=true;e.preventDefault();break}});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const[,y]=pt(e);const pr=mn+(1-(y-p)/(H-2*p))*(mx-mn),up=(drag==='tp')===(rr.side==='long');rr[drag]=Math.max(.05,up?Math.max(pr,rr.entry+.05):Math.min(pr,rr.entry-.05));$('#rrg').innerHTML=rrSVG();$('#rrOut').innerHTML=rrInfo()});
  const finish=()=>{const was=drag;drag=null;hovering=false;if(was)drawX()};
  ['pointerup','pointercancel','pointerleave'].forEach(t=>svg.addEventListener(t,finish));
}

  const vmv=d=>{const sh=(P.mx-P.mn)*.2*d;P.man={mn:P.mn+sh,mx:P.mx+sh};draw()};
  $$('[data-z]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.z;
    if(k==='hp'){P.bw=Math.min(40,P.bw*1.3);draw()}else if(k==='hm'){P.bw=Math.max(2.5,P.bw/1.3);draw()}
    else if(k==='vp')vz(.75);else if(k==='vm')vz(1.33);else if(k==='up')vmv(-1);else vmv(1)});
  if(d.trade)$('#pTS',el).onclick=()=>{const p=st.fo[foKey(d.trade)];if(!p){toast('Buy or sell this option first, then set TP/SL');return}
    if(p.tp||p.sl){delete p.tp;delete p.sl;toast('TP/SL cleared')}
    else{const L=p.q>0,r=v=>Math.max(.05,Math.round(v*20)/20);p.tp=r(p.avg*(L?1.25:.75));p.sl=r(p.avg*(L?.85:1.15));toast('TP/SL set. Drag the T and S handles to change')}
    save();refresh();draw()};
  $('#pAuto',el).onclick=()=>{P.man=null;draw()};
  $('#pX',el).onclick=closePro;
  const pnlTxt=()=>{const t=foPnl()+st.fr,e=$('#pFOv',el);e.className='num '+cl(t);e.textContent=sinr(t)};
  const posStrip=()=>{if(!d.trade)return;const p=st.fo[foKey(d.trade)],u=FOM[d.trade.u],l=ltp(d.trade),e=$('#pPos',el);
    if(!p){e.innerHTML='LTP <b class="num">'+inr(l)+'</b> · No position in this option. Tap Buy to enter.';$('#pTS',el).textContent='+ TP / SL';return}
    const pl=(l-p.avg)*p.q;e.innerHTML=`${p.q>0?'Long':'Short'} ${Math.abs(p.q)/u.lot} lot · Avg <b class="num">${fmt(p.avg)}</b> · LTP <b class="num">${fmt(l)}</b> · P&amp;L <b class="num ${cl(pl)}">${sinr(pl)}</b>${p.tp?' · TP '+fmt(p.tp):''}${p.sl?' · SL '+fmt(p.sl):''}`;$('#pTS',el).textContent=p.tp||p.sl?'Clear TP/SL':'+ TP / SL'};
  const pan=$('#pPan',el);
  const panHTML=()=>{const ps=Object.values(st.fo),un=foPnl(),tot=un+st.fr;
    return`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Positions</h2><button class="pb" id="pPanX">✕</button></div>
    <div class="card pad" style="margin-top:10px"><div class="sub">Total returns</div><div class="big num ${cl(tot)}" id="pTot">${sinr(tot)}</div><div class="sub" style="margin-top:4px">Open <b class="num ${cl(un)}" id="pOpen">${sinr(un)}</b> · Booked <b class="num ${cl(st.fr)}" id="pBkd">${sinr(st.fr)}</b></div></div>
    ${ps.length?`<div class="card list" style="margin-top:10px">${ps.map(p=>{const u=FOM[p.u],k=foKey(p),l=ltp(p),pl=(l-p.avg)*p.q;
      return`<div class="row" data-open="${esc(k)}"><div class="grow"><div class="nm">${foName(p)}</div><div class="sub">${p.q>0?'Long':'Short'} ${Math.abs(p.q)/u.lot} lot · Avg ${fmt(p.avg)} · LTP <b class="num" data-l="${esc(k)}">${fmt(l)}</b>${p.tp?' · TP '+fmt(p.tp):''}${p.sl?' · SL '+fmt(p.sl):''}</div></div><div class="r"><div class="num ${cl(pl)}" data-pl="${esc(k)}">${sinr(pl)}</div><button class="btn ghost sm" data-exit="${esc(k)}" style="margin-top:4px">Exit</button></div></div>`}).join('')}</div>
    <p class="note">Tap a position to see its live premium chart with your buy price and P&amp;L.</p>${ps.length>1?'<button class="btn danger" data-exitall="1" style="width:100%;margin-top:10px">Exit all</button>':''}`:`<div class="card" style="margin-top:10px">${empty('No open positions. Tap Call or Put on the chart to buy.')}</div>`}`};
  const panLive=force=>{if(pan.hidden)return;const sig=Object.keys(st.fo).join('#');
    if(force||sig!==P.sig){P.sig=sig;pan.innerHTML=panHTML();return}
    const set=(id,t,c)=>{const e=$(id,pan);if(e){e.textContent=t;if(c)e.className='num '+c}},un=foPnl(),tot=un+st.fr;
    set('#pTot',sinr(tot),'big num '+cl(tot));set('#pOpen',sinr(un),cl(un));
    Object.values(st.fo).forEach(p=>{const k=foKey(p),l=ltp(p),pl=(l-p.avg)*p.q;$$('[data-l]',pan).forEach(e=>{if(e.dataset.l===k)e.textContent=fmt(l)});$$('[data-pl]',pan).forEach(e=>{if(e.dataset.pl===k){e.textContent=sinr(pl);e.className='num '+cl(pl)}})})};
  const refresh=()=>{pnlTxt();posStrip();panLive();
    const bar=$('#pTSBar',el);if(d.trade&&bar){const p=st.fo[foKey(d.trade)],sig=p&&(p.tp||p.sl)?(p.tp||0)+'|'+(p.sl||0):'',a=document.activeElement;bar.hidden=!sig;
      if(!sig)bar.dataset.sig='';else if(bar.dataset.sig!==sig&&!(a&&a.matches&&a.matches('input')&&bar.contains(a))){bar.innerHTML=tsHTML(p,1);bar.dataset.sig=sig}}};
  $('#pFO',el).onclick=()=>{pan.hidden=!pan.hidden;panLive(true)};
  pan.addEventListener('click',e=>{
    if(e.target.closest('#pPanX')){pan.hidden=true;return}
    const x=e.target.closest('[data-exit]');if(x){const p=st.fo[x.dataset.exit];if(p){foTrade(p,-p.q,ltp(p));save();toast('Position closed');panLive(true);refresh();draw()}return}
    if(e.target.closest('[data-exitall]')){Object.values(st.fo).forEach(p=>foTrade(p,-p.q,ltp(p)));save();toast('All positions closed');panLive(true);refresh();draw();return}
    const r=e.target.closest('[data-open]');if(r){const p=st.fo[r.dataset.open];if(!p)return;const i={u:p.u,t:p.t,k:p.k,e:p.e};closePro();detail={t:'prem',i};range='1D';rr=null;render();openPro()}});
  if(d.fu){const go=ty=>{const u=FOM[d.fu],S=spot(u),k=Math.round(S/u.step)*u.step;sheet={type:'fo',i:{u:u.s,t:ty,k,e:exps(u)[0]},side:'buy'};renderSheet()};
    $('#pCall',el).onclick=()=>go('CE');$('#pPut',el).onclick=()=>go('PE')}
  if(chainU)$('#pChain',el).onclick=()=>{closePro();detail=null;tab='fo';fseg='chain';fou=chainU;foe=0;render()};
  if(d.trade){$('#pS',el).onclick=()=>{sheet={type:'fo',i:d.trade,side:'sell'};renderSheet()};$('#pB',el).onclick=()=>{sheet={type:'fo',i:d.trade,side:'buy'};renderSheet()}}
  P.timer=setInterval(()=>{
    const session=marketSession(),canMove=d.trade?session.optionsOpen:session.indexOpen;
    if(!canMove){refresh();return}
    const px=P.d.px(),now=Date.now();let c=P.cd[N()-1];
    if(now-P.cs>=P.D){P.cd.push({o:c.c,c:px,h:Math.max(c.c,px),l:Math.min(c.c,px),t:c.t+P.m*6e4});P.cs=now;
      if(P.off<0)P.off-=1;P.dr.forEach(o=>{if('x1' in o)o.x1-=1;if('x2' in o)o.x2-=1});if(N()>1500)P.cd.shift()}
    else{c.c=px;c.h=Math.max(c.h,px);c.l=Math.min(c.l,px)}
    if(!P.pts.size)draw();refresh()},500);
  P.rf=refresh;P.dw=draw;addEventListener('resize',resize);P.rs=resize;setTf(5);setTool('sel');resize();refresh()}
function closePro(){if(!PC)return;clearInterval(PC.timer);removeEventListener('resize',PC.rs);removeEventListener('keydown',PC.kd);PC.el.remove();PC=null}

/* ---------- session-gated simulated prices ---------- */
let tk=0;
setInterval(()=>{
  const session=marketSession();
  updateMarketClock();

  // Underlying/index candles and stock prices only move in the configured
  // regular session. Outside it, their last values remain frozen.
  if(session.indexOpen)tick();

  // Keep the UI refresh counter running through the options-only window too.
  // After 15:15 the underlying is frozen; option premiums remain refreshable.
  if(session.optionsOpen){tk++;checkTpSl()}

  if(!session.indexOpen&&!session.optionsOpen)return;
  if(sheet&&(sheet.type==='stock'||sheet.type==='fo'))updSheet(false);
  if(PC)return;
  if(detail){
    if(tk%2===0){
      if(detail.t==='stock'&&session.indexOpen)updStock();
      else if(detail.t==='prem'&&session.optionsOpen)updDet();
      else if(detail.t==='index'&&session.indexOpen)updDet();
    }
    return;
  }
  if(tk%5)return;
  if(tab==='stocks'&&session.indexOpen){fillList()}
  else if((tab==='home'||tab==='pf'||tab==='fo')&&!sheet){
    if(session.indexOpen||session.optionsOpen)render(true);
  }
},500);

render();
updateMarketClock();
})();
</script>

</body></html>
